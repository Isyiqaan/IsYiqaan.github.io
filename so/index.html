
<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">

    <script
        async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9591229850045984"
        crossorigin="anonymous"
    ></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="home-page">

    <div
        class="blob"
        aria-hidden="true"
    ></div>

    <div
        class="blob"
        aria-hidden="true"
    ></div>

    <div
        class="blob"
        aria-hidden="true"
    ></div>

    <main class="content home-content">

        <p class="player-name">
            <span id="welcomeText">Salaan</span>,
            <span data-player-name></span>!
        </p>

        <h1>
            Is Diyaari
        </h1>

     <h2 id="homeMainMessage">
    Ku soo dhowow imtixaanka shakhsiyadda! Waxaad ka jawaabi doontaa su’aalo fudud oo kaa caawinaya inaad ogaato shakhsiyaddaada, oo streak furatid! Badhanka hoose taabo si aad u bilowdid.
</h2>

        <section
            class="home-streak-card"
            aria-label="Streak-gaaga"
        >
            <p class="home-streak-label">
                Streak-gaaga
            </p>

            <div class="home-streak-value">
                🔥
                <span data-streak-day>1</span>
            </div>

            <p class="home-streak-description">
                maalmood
            </p>
        </section>

        <div class="home-action-buttons">

            <button
                id="continueStreakButton"
                class="primary-button continue-streak-button"
                type="button"
            >
                Sii wad streakga 🔥
            </button>

            <button
                id="retakeTestButton"
                class="secondary-button retake-test-button"
                type="button"
            >
                 Shakhsiyadaada eeg
            </button>

        </div>

        <p
            id="streakAlreadyCompletedMessage"
            class="streak-completed-message"
            role="status"
            aria-live="polite"
            hidden
        ></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
