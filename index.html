
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Continue your streak or retake the personality challenge."
    >

    <title>Personality Challenge</title>

    <script
        async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9591229850045984"
        crossorigin="anonymous"
    ></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="home-page">

    <a class="language-switch" href="so/index.html" lang="so">Soomaali</a>

    <div
        class="blob"
        aria-hidden="true"
    ></div>

    <div
        class="blob"
        aria-hidden="true"
    ></div>

    <div
        class="blob"
        aria-hidden="true"
    ></div>

    <main class="content home-content">

        <p class="player-name">
            <span id="welcomeText">Hello</span>,
            <span data-player-name></span>!
        </p>

        <h1>
            Get Ready
        </h1>

     <h2 id="homeMainMessage">
    Welcome to the personality test! Answer a few fun questions to discover your personality and start a daily streak. Tap the button below to begin.
</h2>

        <section
            class="home-streak-card"
            aria-label="Your Streak"
        >
            <p class="home-streak-label">
                Your Streak
            </p>

            <div class="home-streak-value">
                🔥
                <span data-streak-day>1</span>
            </div>

            <p class="home-streak-description">
                days
            </p>
        </section>

        <div class="home-action-buttons">

            <button
                id="continueStreakButton"
                class="primary-button continue-streak-button"
                type="button"
            >
                Continue Your Streak 🔥
            </button>

            <button
                id="retakeTestButton"
                class="secondary-button retake-test-button"
                type="button"
            >
                 View Your Personality
            </button>

            <button
                id="takeTestAgainButton"
                class="secondary-button take-test-again-button"
                type="button"
            >
                Take Test Again
            </button>

        </div>

        <p
            id="streakAlreadyCompletedMessage"
            class="streak-completed-message"
            role="status"
            aria-live="polite"
            hidden
        ></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
